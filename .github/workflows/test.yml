# 全量回归 —— 41 套离线套件，不需要 DSH
#
# ─────────────────────────────────────────────────────────────────────
# 🔴 为什么跑在 Windows 上（这是实测结论，不是偏好）
#
# 2026-09-29 实测：同一次提交，跑在 ubuntu-latest 上 **41 套里挂了 9 套**。
# 从失败断言能直接看出两处根因方向：
#   · `_gate_mode_test.mjs`  → 断言原文「❌ enforce 下路径命中应拒」⇒ **路径语义**不同
#   · `_shelltok_test.mjs`   → **shell 分词语义**不同
#   · 其余若干在导入期就崩溃（Node.js v20.20.2 后无更多输出）
# ⇒ 这套回归**是 Windows 专用的**，与 README 里「在 Windows 11 上开发与验证」一致。
#
# ⚠️ 本项目**没有**把它改成「Linux 上失败也允许通过」——那是假绿，
#    正是这套系统存在的意义所要反对的东西。正确做法是把 CI 钉在**真正验证过的平台**上，
#    并把这条平台边界**写进文档**。
# ─────────────────────────────────────────────────────────────────────
#
# 判定口径沿用本项目的纪律：不看「有没有报错」，看**退出码**与 `ALL-TESTS-GREEN`。

name: 回归测试

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: 41 套离线回归（Windows）
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 确认环境
        shell: bash
        run: |
          node -v
          bash --version | head -1
          # 本脚本用 GNU 语法的 stat -c；Git Bash 支持，用来提前暴露环境不符
          stat -c '%s' _run_all_tests.sh

      - name: 跑全量回归
        shell: bash
        run: bash _run_all_tests.sh | tee regression.log

      - name: 判定（口径：必须出现 ALL-TESTS-GREEN）
        shell: bash
        run: |
          if grep -q '^ALL-TESTS-GREEN$' regression.log; then
            echo "✅ 41 套全绿"
          else
            echo "❌ 未达到 ALL-TESTS-GREEN —— 下面是逐套结果"
            cat regression.log
            exit 1
          fi

      - name: 汇总上传统计
        if: always()
        shell: bash
        run: |
          {
            echo "### 回归结果"
            echo '```'
            tail -8 regression.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
